<style>
        body {

            background-color: #fcf8fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 geometric-bg z-0"></div>
<main class="relative z-10 w-full max-w-[440px] px-6">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_32px_64px_rgba(24,21,52,0.08)] overflow-hidden border border-white/40">
<div class="bg-gradient-to-br from-primary to-primary-container p-8 text-center">
<div class="mb-6 inline-block bg-white p-4 rounded-xl shadow-lg">
<img alt="Logo" class="h-16 w-auto" data-alt="precise geometric brand logo for an algorithm company, minimalist golden ratio icon with dark navy and gold accents on white" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvvFQnmn0XVKsnUSBQUS_WKh8q8HWLNNWY8tu7HYzQSV-mDeN2ABWtSURq7EtsVUp2DRCC41Cm9R6cvldE76JWp9opNTl09wp_LITSq1BaJKpdXSSXZJYGixw3gbTkVAKKEpQV8RUGxYNvlWXLjnYpNkjEOTzNqDpy6VCrUaW8Q-7ncz6wcZgrTycgWZ31mFzYk9kDL3iUbWJoM7y_331vskIUBlkNnV1iVnN1HjdPF-dw8M1O6pxq_IeqUINx82KIzdCDzjiLeJw"/>
</div>
<h1 class="text-white text-2xl font-bold tracking-tight mb-2">منظومة الخوارزمي</h1>
<p class="text-on-primary-container text-sm font-medium opacity-90">نظام إدارة الحضور والتحليل الذكي</p>
</div>
<form class="p-8 space-y-6">
<div class="space-y-2">
<label class="block text-sm font-semibold text-primary/80 pr-1" for="username">اسم المستخدم</label>
<div class="relative group">
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-primary/40 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="block w-full bg-surface-container-high border-none rounded-xl py-3.5 pr-12 pl-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-highest transition-all duration-300" id="username" name="username" placeholder="أدخل اسم المستخدم الخاص بك" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center pr-1">
<label class="block text-sm font-semibold text-primary/80" for="password">كلمة المرور</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-primary/40 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full bg-surface-container-high border-none rounded-xl py-3.5 pr-12 pl-12 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-highest transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 left-0 pl-4 flex items-center text-primary/40 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between px-1">
<label class="flex items-center cursor-pointer group">
<input class="w-5 h-5 rounded-lg border-none bg-surface-container-high text-secondary focus:ring-secondary/20 transition-all" type="checkbox"/>
<span class="mr-3 text-sm text-on-surface-variant group-hover:text-primary transition-colors">تذكرني على هذا الجهاز</span>
</label>
<a class="text-sm font-medium text-primary hover:text-secondary transition-colors underline-offset-4 hover:underline" href="#">نسيت كلمة المرور؟</a>
</div>
<button class="w-full bg-secondary-container hover:bg-secondary-fixed-dim text-on-secondary-container font-bold py-4 rounded-xl shadow-lg shadow-secondary-container/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98]" type="submit">
<span>تسجيل الدخول للنظام</span>
<span class="material-symbols-outlined font-bold">login</span>
</button>
<div class="pt-4 border-t border-surface-container-highest flex flex-col items-center gap-3">
<p class="text-xs text-on-surface-variant text-center leading-relaxed">
                        عن طريق تسجيل الدخول، أنت توافق على <br/>
<a class="text-primary font-semibold" href="#">سياسة الخصوصية</a> و <a class="text-primary font-semibold" href="#">شروط الاستخدام</a>
</p>
</div>
</form>
</div>
<div class="mt-8 text-center">
<p class="text-on-surface-variant/60 text-xs">

            </p>
</div>

<div class="fixed bottom-0 right-0 p-12 opacity-[0.03] pointer-events-none select-none">
<span class="material-symbols-outlined text-[240px]" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</div>
<div class="fixed top-0 left-0 p-12 opacity-[0.03] pointer-events-none select-none">
<span class="material-symbols-outlined text-[240px]" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
</body></html>
