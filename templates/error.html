{% extends 'base.html' %}

{% block title %}منظومة الخوارزمي - خطأ في النظام{% endblock %}

{% block body %}
<div class="min-h-[70vh] flex items-center justify-center animate-fade-in-up">
    <div class="w-full max-w-lg text-center">
        <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-surface-container dark:border-slate-800 p-8 md:p-12 relative overflow-hidden">
            <!-- Alert Background -->
            <div class="absolute -top-12 -left-12 w-48 h-48 bg-red-500/5 rounded-full blur-3xl opacity-50"></div>
            
            <div class="relative z-10">
                <div class="w-24 h-24 bg-red-50 dark:bg-red-950/30 text-red-500 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg shadow-red-500/10">
                    <span class="material-symbols-outlined text-[48px]">wifi_off</span>
                </div>

                <h1 class="text-2xl font-black text-primary dark:text-white mb-4 font-headline">فشل الاتصال بالجهاز</h1>
                <p class="text-xs font-bold text-outline dark:text-slate-500 uppercase tracking-widest leading-relaxed mb-10 px-8">
                    تعذر الاتصال بجهاز البصمة (ZKTeco). يرجى التحقق من اتصال الشبكة والتأكد من إعدادات المعرفات (IP Port).
                </p>

                <div class="space-y-4">
                    <button onclick="window.location.reload();" class="w-full flex flex-row-reverse items-center justify-center gap-3 bg-red-600 hover:bg-red-700 text-white px-8 py-5 rounded-2xl font-black shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all">
                        <span class="material-symbols-outlined">refresh</span>
                        <span>إعادة المحاولة الآن</span>
                    </button>
                    <a href="{% url 'Attendance:dashboard' %}" class="block text-[10px] font-black text-outline hover:text-primary transition-colors uppercase tracking-widest py-2">
                        العودة للرئيسية
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
