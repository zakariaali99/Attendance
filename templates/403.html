{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-black/90 p-4">
    <div class="max-content w-full max-w-md text-center">
        <div class="mb-8">
            <span class="material-symbols-outlined text-[120px] text-error animate-pulse">
                gpp_bad
            </span>
        </div>
        
        <h1 class="text-3xl font-black text-slate-900 dark:text-white mb-4 font-display">
            وصول غير مصرح به
        </h1>
        
        <p class="text-slate-600 dark:text-slate-400 mb-10 text-lg leading-relaxed">
            عذراً، ليس لديك الصلاحيات الكافية للوصول إلى هذه الصفحة. يرجى التواصل مع مسؤول النظام إذا كنت تعتقد أن هذا خطأ.
        </p>

        <div class="flex flex-col gap-4">
            <button onclick="window.history.back()" class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg shadow-xl shadow-primary/20 hover:scale-[1.02] transition-transform flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">arrow_forward</span>
                العودة للصفحة السابقة
            </button>
            
            <a href="{% url 'Attendance:dashboard' %}" class="w-full py-4 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-2xl font-bold text-lg border border-slate-200 dark:border-white/5 hover:bg-slate-50 transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">dashboard</span>
                العودة للوحة التحكم
            </a>
        </div>
    </div>
</div>
{% endblock %}
