{% extends "base.html" %}

{% block title %}خطأ في الخادم - منظومة الخوارزمي{% endblock %}

{% block body %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
    <div class="w-24 h-24 bg-error/10 text-error rounded-full flex items-center justify-center mb-6">
        <span class="material-symbols-outlined text-5xl">error</span>
    </div>
    <h1 class="text-3xl font-black text-primary dark:text-white mb-4 font-headline">عذراً، حدث خطأ داخلي</h1>
    <p class="text-on-surface-variant dark:text-slate-400 max-w-md mb-8 font-body">
        حدث خطأ غير متوقع في النظام. تم تسجيل تفاصيل الخطأ للمراجعة. يرجى المحاولة مرة أخرى لاحقاً أو التواصل مع الدعم الفني.
    </p>
    <a href="{% url 'Attendance:dashboard' %}" class="px-8 py-3 bg-primary text-white rounded-xl font-bold hover:bg-primary/90 transition-all flex items-center gap-2">
        <span class="material-symbols-outlined">home</span>
        العودة للرئيسية
    </a>
</div>
{% endblock %}
