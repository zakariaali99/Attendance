{% if page_obj.has_other_pages %}
<div class="flex flex-row-reverse justify-center items-center mt-8 mb-6">
    <nav class="inline-flex items-center gap-1.5 bg-white dark:bg-slate-900 px-3 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-lg shadow-slate-200/50 dark:shadow-none">
        {% if page_obj.has_previous %}
        <a href="?{{ params }}&page={{ page_obj.previous_page_number }}" 
           class="group w-9 h-9 flex items-center justify-center rounded-xl text-slate-600 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/20 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all duration-200">
            <span class="material-symbols-outlined text-[20px] group-hover:translate-x-0.5 transition-transform">chevron_right</span>
        </a>
        <div class="w-px h-5 bg-slate-200 dark:bg-slate-700 mx-1"></div>
        {% endif %}

        <div class="flex items-center gap-1.5 px-2">
            <span class="w-9 h-9 flex items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-600 text-white font-bold text-sm shadow-md shadow-indigo-500/30 ring-2 ring-indigo-500/20">
                {{ page_obj.number }}
            </span>
            <span class="text-xs font-medium text-slate-400 dark:text-slate-500 mx-1">من</span>
            <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">{{ page_obj.paginator.num_pages }}</span>
        </div>

        {% if page_obj.has_next %}
        <div class="w-px h-5 bg-slate-200 dark:bg-slate-700 mx-1"></div>
        <a href="?{{ params }}&page={{ page_obj.next_page_number }}" 
           class="group w-9 h-9 flex items-center justify-center rounded-xl text-slate-600 dark:text-slate-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/20 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all duration-200">
            <span class="material-symbols-outlined text-[20px] group-hover:-translate-x-0.5 transition-transform">chevron_left</span>
        </a>
        {% endif %}
    </nav>
</div>
{% endif %}
