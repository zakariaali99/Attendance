{% if is_paginated %}
    <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
            <li class="page-item {% if not page_obj.has_previous %} disabled {% endif %}">
                <a class="page-link" href="{% if  page_obj.has_previous %}
                ?page={{ page_obj.previous_page_number }}&{{ old_q }}
                {% else %}# {% endif %}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item"><a class="page-link" href="?page={{ page_obj.number }}">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</a></li>

            <li class="page-item {% if not page_obj.has_next %} disabled {% endif %}">
                <a class="page-link" href="{% if page_obj.has_next %}
                ?page={{ page_obj.next_page_number }}&{{ old_q }}
                {% else %}# {% endif %}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

{% endif %}
