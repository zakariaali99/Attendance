{% extends 'base.html' %}


<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex align-items-center mb-4">
                <a href="{% url 'Attendance:exception' %}"
                    class="btn btn-outline-secondary rounded-pill px-3 shadow-sm ms-3">
                    <i class="bi bi-arrow-right ms-1"></i> رجوع
                </a>
                <h3 class="mb-0 fw-bold">تعديل الإذن</h3>
            </div>

            <div class="card border-0 shadow-lg bg-hti rounded-4">
                <div class="card-body p-5">
                    <form method="post">
                        {% csrf_token %}
                        {% if form.errors %}
                        <div class="alert alert-danger mb-4 rounded-3 border-0">
                            {{ form.errors }}
                        </div>
                        {% endif %}

                        <div class="row g-4">
                            <div class="col-12 mt-4">
                                <h6 class="text-primary fw-bold text-uppercase border-bottom border-glass pb-2">
                                    <i class="bi bi-clock ms-2"></i>تفاصيل الإذن
                                </h6>
                            </div>

                            <div class="col-12">
                                <label for="{{ form.employee.id_for_label }}"
                                    class="form-label fw-bold text-muted small text-uppercase">
                                    <i class="bi bi-person ms-1"></i>الموظف
                                </label>
                                {{ form.employee }}
                            </div>

                            <div class="col-md-6">
                                <label for="{{ form.date.id_for_label }}"
                                    class="form-label fw-bold text-muted small text-uppercase">
                                    <i class="bi bi-calendar-event ms-1"></i>تاريخ الإذن
                                </label>
                                {{ form.date }}
                            </div>

                            <div class="col-md-6">
                                <label for="{{ form.type.id_for_label }}"
                                    class="form-label fw-bold text-muted small text-uppercase">
                                    <i class="bi bi-list-task ms-1"></i>نوع الإذن
                                </label>
                                {{ form.type }}
                            </div>

                            <div class="col-12">
                                <label for="{{ form.note.id_for_label }}"
                                    class="form-label fw-bold text-muted small text-uppercase">
                                    <i class="bi bi-sticky ms-1"></i>ملاحظات
                                </label>
                                {{ form.note }}
                            </div>

                            <div class="col-12 mt-5">
                                <div class="d-flex justify-content-center gap-3">
                                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 flex-grow-1">
                                        <i class="bi bi-check2-circle ms-1"></i> حفظ التعديلات
                                    </button>
                                    <a href="{% url 'Attendance:exception' %}"
                                        class="btn btn-outline-light btn-lg rounded-pill px-5">إلغاء</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
