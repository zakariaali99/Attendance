{% extends 'base.html' %}

{% block body %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex align-items-center mb-6 flex-row-reverse justify-between">
                <h3 class="text-3xl font-black text-primary dark:text-white font-headline">تعديل الإذن</h3>
                <a href="{% url 'Attendance:exception' %}"
                    class="flex items-center gap-2 px-4 py-2 rounded-xl border border-surface-container dark:border-slate-700 text-outline hover:bg-surface-container transition-all">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span class="font-bold text-sm">رجوع</span>
                </a>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-lg border border-surface-container dark:border-slate-800 overflow-hidden animate-fade-in-up">
                <div class="p-8">
                    <form method="post" class="space-y-6">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                        <div class="p-4 bg-error/10 border border-error/20 rounded-2xl text-error text-sm font-bold">
                            {{ form.errors }}
                        </div>
                        {% endif %}

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-right" dir="rtl">
                            <div class="col-span-2">
                                <label class="block text-xs font-black text-outline uppercase tracking-widest mb-2">الموظف</label>
                                {{ form.employee }}
                            </div>

                            <div>
                                <label class="block text-xs font-black text-outline uppercase tracking-widest mb-2">تاريخ الإذن</label>
                                {{ form.date }}
                            </div>

                            <div>
                                <label class="block text-xs font-black text-outline uppercase tracking-widest mb-2">نوع الإذن</label>
                                {{ form.type }}
                            </div>

                            <div class="col-span-2">
                                <label class="block text-xs font-black text-outline uppercase tracking-widest mb-2">ملاحظات</label>
                                {{ form.note }}
                            </div>
                        </div>

                        <div class="pt-6 flex gap-4 flex-row-reverse">
                            <button type="submit" class="flex-grow bg-primary text-white py-4 rounded-2xl font-black shadow-lg hover:scale-[1.01] active:scale-[0.99] transition-all">
                                حفظ التعديلات
                            </button>
                            <a href="{% url 'Attendance:exception' %}"
                                class="px-8 py-4 rounded-2xl border border-surface-container dark:border-slate-800 text-outline font-bold hover:bg-surface-container transition-all">
                                إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
