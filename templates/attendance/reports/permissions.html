{% extends 'base.html' %}

{% block body %}
  <br>
    <br>
    <br>
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <h3>اضافة إذن</h3>
            </div>
            <div class="col"></div>
            <div class="col-8">

                <form method="post">

                    {% csrf_token %}
                    <div class="container">
                        <div class="row">
                            <div class="col-12">
                                {{ form.errors }}
                                <div class="h1 text-center m-3">{{ employee.name }}</div>
                            </div>

                            <div class="col-4">
                                <div class="mb-3 ">
                                    <label for="{{ form.start_time.id_for_label }}" class="form-label">
                                        التاريخ والوقت
                                        </label>
                                    {{ form.timestamp }}
                                </div>
                            </div>


                            <div class="col-4">
                                <div class="mb-3 ">
                                    <label for="{{ form.type.id_for_label }}" class="form-label">نوع الاذن</label>
                                    {{ form.status }}
                                </div>
                            </div>

                            <div class="col-4">
                                <div class="mb-3 ">
                                    <label for="{{ form.type.id_for_label }}" class="form-label"> الجهاز</label>
                                    {{ form.device }}
                                </div>
                            </div>



                            <div class="col-12">
                                <div class="mb-3">
                                    <label for="{{ form.note.id_for_label }}" class="form-label">ملاحظات</label>
                                    {{ form.note }}
                                </div>
                            </div>


                            <div class='row'>
                            <div class="col"></div>
                            <div class="col-3 mt-2">
                                <button type="submit" class="btn btn-primary w-100 rounded-pill">حفظ</button>
                            </div>
                            <div class="col"></div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col"></div>
        </div>
    </div>



    <br>
    <br>
    <br>




{% endblock %}


{% block scripts %}
<script>
    $("#employee_all").click(function () {
        $("input[name='employees']").prop('checked', $(this).prop('checked'));
    });

</script>{% endblock %}
