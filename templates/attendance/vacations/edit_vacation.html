{% extends 'base.html' %}


{% block body %}
    <br>
    <br>
    <br>
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <h3>تعديل اجازة</h3>
            </div>
            <div class="col"></div>
            <div class="col-8">

                <form method="post">
                    
                    {% csrf_token %}
                    <div class="container">
                        <div class="row">
                            <div class="col-12">
                                {{ form.errors }}
                            </div>
                            <div class="col-6">
                                <div class="mb-3">
                                    <label for="{{ form.date.id_for_label }}" class="form-label"> من</label>
                                    {{ form.date }}
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="mb-3">
                                    <label for="{{ form.to_date.id_for_label }}" class="form-label">الي</label>
                                    {{ form.to_date }}
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="mb-3">
                                    <label for="{{ form.vacation_type.id_for_label }}" class="form-label">نوع الاجازة</label>
                                    {{ form.vacation_type }}
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="mb-3">
                                    <label for="{{ form.note.id_for_label }}" class="form-label">ملاحظات</label>
                                    {{ form.note }}
                                </div>
                            </div>
                            
                            
                            <div class="col-12">
                                <div class="mb-3">
                                    <label for="{{ form.employee.id_for_label }}" class="form-label">الموظف</label>
                                {{ form.employee }}
                                
                                    
                                </div>
                            </div>
                            
                            
                            
                            <div class='row'>
                            <div class="col"></div>
                            <div class="col-3 mt-2">
                                <button type="submit" class="btn btn-primary w-100 rounded-pill">حفظ</button>
                            </div>
                            <div class="col"></div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col"></div>
        </div>
    </div>



    <br>
    <br>
    <br>



{% endblock %}
